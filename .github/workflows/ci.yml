name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck (strict, src + tests + scripts)
        run: npx tsc --noEmit && npx tsc -p tsconfig.check.json

      - name: Test suite
        run: npm test

      - name: Redaction self-test (fixture secrets must never reach JSON output)
        run: npm run selftest

      - name: Prove zero network calls (run with networking disabled)
        run: |
          unshare -rn -- bash -c "SESSGUARD_ROOT=$PWD/examples/demo-profile node dist/cli.js inventory --json /tmp/sg-net-inv.json && SESSGUARD_ROOT=$PWD/examples/demo-profile node dist/cli.js checklist --json /tmp/sg-net-chk.json && node dist/cli.js --version"
